<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Asphalt · Demo map</title>
<meta name="description" content="Asphalt road anomaly map populated with synthetic data for New York City, Chicago and Los Angeles.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1c1e'/%3E%3Cpath d='M6 22h20' stroke='%23e0f354' stroke-width='3' stroke-dasharray='5 3'/%3E%3Cpath d='M12 13q4 5 8 0' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  /* Same 60-30-10 palette as the landing page: charcoal ground, yellow data, orange signals. */
  --charcoal:#1c1c1e;
  --yellow:#e0f354;
  --orange:#fd550a;
  --bg:var(--charcoal);
  --surface:#26262a;
  --fg:#f4f1e6;
  --fg-mute:#a8a8a2;
  --line:rgba(244,241,230,.16);
  --c-high:var(--yellow);
  --c-mid:var(--orange);
  --c-low:#7d7d78;
  --f-sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.label{font-family:var(--f-mono);font-size:.7rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-mute);margin:0 0 10px}
.num{font-variant-numeric:tabular-nums lining-nums}

.app{display:flex;flex-direction:column;height:100dvh}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;flex-shrink:0;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.brand svg{width:22px;height:22px;flex:none}
.brand small{font-family:var(--f-mono);font-size:.7rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-mute);padding-left:10px;border-left:1px solid var(--line)}
.cities{display:flex;border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.city-btn{flex:none;background:none;border:0;border-left:1px solid var(--line);color:var(--fg-mute);font:500 .85rem/1 var(--f-sans);padding:10px 14px;cursor:pointer;white-space:nowrap}
.city-btn:first-child{border-left:0}
.city-btn:hover{color:var(--fg)}
.city-btn.active{background:var(--yellow);color:var(--charcoal)}

/* map + sidebar */
.body{display:flex;flex:1;min-height:0}
#map{flex:1;min-height:0;background:var(--bg)}
.side{width:360px;flex-shrink:0;overflow-y:auto;border-left:1px solid var(--line);padding:20px 20px max(20px,env(safe-area-inset-bottom,0px))}
.side section{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.side section:last-child{border-bottom:0;margin-bottom:0}

.stats{display:grid;grid-template-columns:1fr 1fr;margin:0}
.stats div{display:flex;flex-direction:column-reverse;justify-content:flex-end;padding:10px 0 12px}
.stats div:nth-child(odd){padding-right:12px;border-right:1px solid var(--line)}
.stats div:nth-child(even){padding-left:16px}
.stats div:nth-child(-n+2){border-bottom:1px solid var(--line)}
.stats dd{margin:0;font-weight:700;font-stretch:80%;font-size:2rem;line-height:1;letter-spacing:-.02em;color:var(--yellow)}
.stats dt{margin-top:6px;font-size:.8rem;color:var(--fg-mute)}

.chart{display:block;width:100%;height:64px}
.chart rect{fill:var(--yellow)}
.chart-cap{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--f-mono);font-size:.7rem;color:var(--fg-mute)}

.mix{display:flex;height:10px;background:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.8rem;color:var(--fg-mute)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}

.field{display:block;margin-bottom:14px;font-size:.85rem;color:var(--fg-mute)}
.field b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
input[type=range]{display:block;width:100%;margin-top:8px;accent-color:var(--orange)}
select{display:block;width:100%;margin-top:6px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:0;padding:9px 10px;font:inherit;font-size:.9rem}
.check{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:.88rem;cursor:pointer}
.check input{width:16px;height:16px;margin:0;accent-color:var(--orange)}

.list{display:flex;flex-direction:column}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:inherit;font:inherit;padding:12px 0;cursor:pointer}
.item:first-child{border-top:0;padding-top:0}
.item:hover .item-type{color:var(--yellow)}
.item-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.item-type{font-weight:700;font-size:1rem}
.item-conf{font-family:var(--f-mono);font-size:.85rem}
.item-meta{display:block;margin-top:3px;font-size:.8rem;color:var(--fg-mute)}

.note{font-size:.8rem;color:var(--fg-mute);margin:0}
.note a{color:var(--fg);text-underline-offset:3px}
.back{display:inline-block;margin-top:12px;font-weight:600;font-size:.88rem;text-underline-offset:4px}

/* leaflet */
.leaflet-container{font-family:var(--f-sans)}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--bg);color:var(--fg);border-color:var(--line)}
.leaflet-bar{border:1px solid var(--line)!important;border-radius:0!important}
.leaflet-bar a{border-radius:0!important}
.leaflet-control-attribution{background:rgba(28,28,30,.8)!important;color:var(--fg-mute)}
.leaflet-control-attribution a{color:var(--fg)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg);color:var(--fg);border-radius:0;box-shadow:0 0 0 1px var(--line)}
.leaflet-container a.leaflet-popup-close-button{color:var(--fg-mute)}
.pop-title{font-weight:700;font-size:1rem;margin-bottom:6px}
.pop-row{font-size:.8rem;color:var(--fg-mute)}
.pop-row span{color:var(--fg);font-family:var(--f-mono)}

@media (max-width:820px){
  .app{height:auto;min-height:100dvh}
  .body{flex-direction:column}
  #map{flex:none;height:58svh}
  .side{width:100%;border-left:0;border-top:1px solid var(--line);overflow:visible;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .cities{width:100%}
  .city-btn{flex:1 0 auto;padding:10px 8px;font-size:.8rem}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="../" aria-label="Asphalt home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="7.5" fill="currentColor"/><path d="M1 20.5 H23" stroke="var(--orange)" stroke-width="2.4" stroke-dasharray="4 2.5"/></svg>
      asphalt <small>Demo map · synthetic data</small>
    </a>
    <nav class="cities" id="cities" aria-label="City"></nav>
  </header>

  <div class="body">
    <div id="map" role="region" aria-label="Map of road anomalies"></div>

    <aside class="side">
      <section>
        <p class="label">Overview</p>
        <dl class="stats num">
          <div><dt>Phone reports</dt><dd id="s-events">–</dd></div>
          <div><dt>Confirmed anomalies</dt><dd id="s-clusters">–</dd></div>
          <div><dt>Reports, last 24 h</dt><dd id="s-24h">–</dd></div>
          <div><dt>Average confidence</dt><dd id="s-conf">–</dd></div>
        </dl>
      </section>

      <section>
        <p class="label">Reports per day · last 90 days</p>
        <svg class="chart" id="chart" preserveAspectRatio="none" role="img" aria-label="Reports per day over the last 90 days"></svg>
        <div class="chart-cap"><span>90 days ago</span><span id="chart-peak"></span><span>today</span></div>
      </section>

      <section>
        <p class="label">Who reported</p>
        <div class="mix" id="mix"></div>
        <div class="legend" id="mix-legend"></div>
      </section>

      <section>
        <p class="label">Filters</p>
        <label class="field">Minimum confidence <b id="conf-val">30%</b>
          <input type="range" id="conf-range" min="0" max="100" value="30">
        </label>
        <label class="field">Anomaly type
          <select id="type-filter">
            <option value="">All types</option>
            <option value="pothole">Pothole</option>
            <option value="bump">Speed bump</option>
            <option value="rough_patch">Rough patch</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="cross-only"> Confirmed by a car and a motorcycle</label>
        <label class="check"><input type="checkbox" id="show-raw"> Show raw phone reports</label>
        <div class="legend">
          <span><i class="dot" style="background:var(--c-high)"></i>≥ 75%</span>
          <span><i class="dot" style="background:var(--c-mid)"></i>45–75%</span>
          <span><i class="dot" style="background:var(--c-low)"></i>&lt; 45%</span>
        </div>
      </section>

      <section>
        <p class="label" id="list-heading">Worst stretches</p>
        <div class="list" id="list"></div>
      </section>

      <section>
        <p class="note" id="about"></p>
        <a class="back" href="../">← Back to Asphalt</a>
      </section>
    </aside>
  </div>
</div>

<script>
const VEHICLES = {
  four_wheeler: { label: 'Car', short: 'car', color: '#f4f1e6' },
  two_wheeler: { label: 'Motorcycle', short: 'moto', color: '#fd550a' },
};
const TYPE_LABEL = { pothole: 'Pothole', bump: 'Speed bump', rough_patch: 'Rough patch', unknown: 'Unknown' };
const CONF = { high: '#e0f354', mid: '#fd550a', low: '#7d7d78' };
const DAY_MS = 86400000;
const $ = id => document.getElementById(id);

const map = L.map('map', { preferCanvas: true }).setView([39.5, -98.35], 4);
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
L.tileLayer(ESRI + 'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 16,
}).addTo(map);
L.tileLayer(ESRI + 'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(map);

const clusterLayer = L.layerGroup().addTo(map);
const rawLayer = L.layerGroup();
const markers = new Map();
let DATA = null;
let city = 'nyc';

const confColor = c => c >= 0.75 ? CONF.high : c >= 0.45 ? CONF.mid : CONF.low;
const fmt = n => n.toLocaleString('en-US');
const pct = c => `${Math.round(c * 100)}%`;
const vehicleSummary = counts => Object.keys(VEHICLES).filter(v => counts[v]).map(v => `${counts[v]} ${VEHICLES[v].short}`).join(' · ');
const ago = ms => {
  const d = Math.floor((DATA.stats.generated_at_ms - ms) / DAY_MS);
  return d <= 0 ? 'today' : d === 1 ? 'yesterday' : `${d} days ago`;
};
const inCity = c => city === 'all' || c.city === city;
const cityRows = () => {
  const idx = DATA.events.cities.indexOf(city);
  return city === 'all' ? DATA.events.rows : DATA.events.rows.filter(r => r[5] === idx);
};

function popup(c) {
  return `<div class="pop-title">${TYPE_LABEL[c.anomaly_type] || c.anomaly_type}</div>
    <div class="pop-row">Confidence <span>${pct(c.confidence)}</span></div>
    <div class="pop-row">Reports <span>${c.event_count}</span> (${vehicleSummary(c.vehicle_type_counts || {})})</div>
    <div class="pop-row">Average intensity <span>${c.avg_intensity.toFixed(2)}</span></div>
    <div class="pop-row">Spread <span>${c.radius_m.toFixed(1)} m</span></div>
    <div class="pop-row">Last reported <span>${ago(c.last_seen_ms)}</span></div>`;
}

function filtered() {
  const minConf = $('conf-range').value / 100;
  const type = $('type-filter').value;
  const cross = $('cross-only').checked;
  return DATA.clusters.filter(c =>
    inCity(c) && c.confidence >= minConf && (!type || c.anomaly_type === type) &&
    (!cross || c.vehicle_type_diversity >= 2));
}

function renderClusters() {
  clusterLayer.clearLayers();
  markers.clear();
  const list = filtered();
  for (const c of list) {
    const col = confColor(c.confidence);
    const m = L.circleMarker([c.latitude, c.longitude], {
      radius: Math.max(5, Math.min(16, 4 + Math.sqrt(c.event_count) * 2.2)),
      color: col, weight: 1.5, fillColor: col, fillOpacity: 0.4,
    }).bindPopup(popup(c));
    markers.set(c.cluster_id, m);
    clusterLayer.addLayer(m);
  }

  const top = [...list].sort((a, b) => (b.confidence - a.confidence) || (b.avg_intensity - a.avg_intensity)).slice(0, 12);
  $('list-heading').textContent = `Worst stretches · ${fmt(list.length)} on map`;
  $('list').innerHTML = top.length ? top.map(c => `
    <button class="item" type="button" data-id="${c.cluster_id}">
      <span class="item-top"><span class="item-type">${TYPE_LABEL[c.anomaly_type]}</span><span class="item-conf" style="color:${confColor(c.confidence)}">${pct(c.confidence)}</span></span>
      <span class="item-meta">${DATA.stats.cities[c.city].name} · ${vehicleSummary(c.vehicle_type_counts || {})} · ${ago(c.last_seen_ms)}</span>
    </button>`).join('') : '<p class="note">No anomalies match these filters.</p>';
}

function renderRaw() {
  rawLayer.clearLayers();
  if (!$('show-raw').checked) { map.removeLayer(rawLayer); return; }
  const types = DATA.events.vehicle_types;
  for (const [lat, lon, , v] of cityRows()) {
    rawLayer.addLayer(L.circleMarker([lat, lon], {
      radius: 3, stroke: false, fillColor: (VEHICLES[types[v]] || VEHICLES.four_wheeler).color, fillOpacity: 0.8,
    }));
  }
  rawLayer.addTo(map);
}

function renderStats() {
  const rows = cityRows();
  const clusters = DATA.clusters.filter(inCity);
  const gen = DATA.stats.generated_at_ms;
  $('s-events').textContent = fmt(rows.length);
  $('s-clusters').textContent = fmt(clusters.length);
  $('s-24h').textContent = fmt(rows.filter(r => gen - r[2] <= DAY_MS).length);
  $('s-conf').textContent = pct(clusters.reduce((a, c) => a + c.confidence, 0) / (clusters.length || 1));

  const days = new Array(90).fill(0);
  for (const r of rows) {
    const d = Math.floor((gen - r[2]) / DAY_MS);
    if (d >= 0 && d < 90) days[89 - d]++;
  }
  const peak = Math.max(...days, 1), h = 64;
  const svg = $('chart');
  svg.setAttribute('viewBox', `0 0 90 ${h}`);
  svg.innerHTML = days.map((n, i) => {
    const bh = Math.max(n ? 1 : 0, (n / peak) * (h - 2));
    return `<rect x="${i + 0.12}" y="${h - bh}" width="0.76" height="${bh}" opacity="${i >= 83 ? 1 : 0.55}"><title>${n} reports, ${i === 89 ? 'today' : `${89 - i} days ago`}</title></rect>`;
  }).join('');
  $('chart-peak').textContent = `peak ${peak}/day`;

  const types = DATA.events.vehicle_types;
  const counts = types.map(() => 0);
  for (const r of rows) counts[r[3]]++;
  const total = rows.length || 1;
  const shown = types.map((v, i) => [VEHICLES[v], counts[i]]).filter(([v, n]) => v && n);
  $('mix').innerHTML = shown.map(([v, n]) => `<div style="width:${(n / total) * 100}%;background:${v.color}" title="${v.label}"></div>`).join('');
  $('mix-legend').innerHTML = shown.map(([v, n]) => `<span><i class="dot" style="background:${v.color}"></i>${v.label} ${Math.round((n / total) * 100)}%</span>`).join('');
}

function selectCity(key) {
  city = key;
  document.querySelectorAll('.city-btn').forEach(b => {
    const on = b.dataset.city === key;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on);
  });
  if (key === 'all') map.fitBounds(DATA.clusters.map(c => [c.latitude, c.longitude]), { padding: [30, 30] });
  else map.setView(DATA.stats.cities[key].center, DATA.stats.cities[key].zoom);
  try { localStorage.setItem('asphalt-demo-city', key); } catch (e) {}
  renderStats(); renderClusters(); renderRaw();
}

async function load() {
  const [clusters, stats, events] = await Promise.all(
    ['clusters', 'stats', 'events-lite'].map(f => fetch(`data/${f}.json`).then(r => r.json())));
  DATA = { clusters: clusters.clusters, stats, events };

  const btns = [['all', 'All cities'], ...Object.entries(stats.cities).map(([k, c]) => [k, c.name])];
  $('cities').innerHTML = btns.map(([k, n]) => `<button class="city-btn" type="button" data-city="${k}">${n}</button>`).join('');
  $('cities').addEventListener('click', e => { const b = e.target.closest('.city-btn'); if (b) selectCity(b.dataset.city); });

  $('about').innerHTML = `Every report on this page is synthetic, generated by
    <a href="https://github.com/neerajkumar-n/asphalt/tree/main/tools/synthetic">tools/synthetic</a>
    (seed ${stats.seed}, as of ${new Date(stats.generated_at_ms).toLocaleDateString('en-US', { dateStyle: 'medium' })}).
    Anomalies are clustered with the same DBSCAN and confidence scoring as the Asphalt backend.`;

  let start = 'nyc';
  try { start = localStorage.getItem('asphalt-demo-city') || start; } catch (e) {}
  selectCity(start === 'all' || stats.cities[start] ? start : 'nyc');
}

$('conf-range').addEventListener('input', e => { $('conf-val').textContent = `${e.target.value}%`; renderClusters(); });
['type-filter', 'cross-only'].forEach(id => $(id).addEventListener('change', renderClusters));
$('show-raw').addEventListener('change', renderRaw);
$('list').addEventListener('click', e => {
  const item = e.target.closest('.item');
  const m = item && markers.get(item.dataset.id);
  if (m) { map.flyTo(m.getLatLng(), 16, { duration: 0.8 }); setTimeout(() => m.openPopup(), 850); }
});

load().catch(err => {
  $('about').textContent = `Could not load demo data: ${err.message}. Serve this folder over HTTP (for example with python3 -m http.server) rather than opening the file directly.`;
});
</script>
</body>
</html>
